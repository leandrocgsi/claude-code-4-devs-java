services:
  db:
    image: mysql:9.7
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: docker
      MYSQL_USER: docker
      MYSQL_PASSWORD: docker
      MYSQL_DATABASE: claude_code_4_devs
      MYSQL_ROOT_HOST: '%'
    ports:
      - 3308:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdocker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erudio-network

  rest-react-java-server:
    image: leandrocgsi/rest-react-java-server
    restart: always
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/claude_code_4_devs?useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: docker
    ports:
      - 8080:8080
    command: mvn spring-boot:run
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erudio-network

networks:
  erudio-network:
    driver: bridge